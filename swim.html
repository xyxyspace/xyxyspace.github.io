<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>swim</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.11.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/body-pix@2.2.0"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #5AB4D4;
            overflow: hidden;
        }

        #video {
            display: none;
        }

        #canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        /* ================= 优化：Loading 界面改为透明/毛玻璃设计 ================= */
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: white;
            z-index: 100;
            /* 改为半透明毛玻璃 */
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 50px;
            border-radius: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            max-width: 90%;
        }

        .spinner {
            width: 50px;
            height: 50px;
            margin: 0 auto 30px auto;
            border: 4px solid rgba(255, 255, 255, 0.2);
            border-top: 4px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #info {
           display: none;
        }

        /* ================= 音乐模块样式 (保持毛玻璃质感) ================= */
        #music-container {
            position: absolute; bottom: 30px; right: 30px; z-index: 1000;
            display: flex; flex-direction: column; align-items: flex-end; gap: 12px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        .glass-btn {
            width: 44px; height: 44px; border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: white; display: flex; justify-content: center; align-items: center;
            cursor: pointer; transition: all 0.3s;
        }
        .glass-btn:hover { background: rgba(255, 255, 255, 0.25); transform: scale(1.05); }

        #music-menu {
            width: 240px; max-height: 320px;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 20px; padding: 16px; color: white;
            display: flex; flex-direction: column; gap: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.15);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            transform-origin: bottom right;
        }
        #music-menu.hidden { opacity: 0; transform: scale(0.9) translateY(10px); pointer-events: none; }

        .upload-area {
            border: 1px dashed rgba(255, 255, 255, 0.4);
            border-radius: 12px; padding: 10px; text-align: center;
            font-size: 12px; cursor: pointer; transition: background 0.2s;
        }
        .upload-area:hover { background: rgba(255, 255, 255, 0.1); }
        
        .mode-switch {
            display: flex; background: rgba(0, 0, 0, 0.1);
            border-radius: 8px; padding: 2px;
        }
        .mode-btn {
            flex: 1; text-align: center; font-size: 11px; padding: 4px;
            border-radius: 6px; cursor: pointer; transition: 0.2s;
            display: flex; justify-content: center; align-items: center;
        }
        .mode-btn.active { background: rgba(255, 255, 255, 0.2); }

        #playlist {
            flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 4px;
            padding-right: 4px;
        }
        #playlist::-webkit-scrollbar { width: 3px; }
        #playlist::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.3); border-radius: 10px; }

        .track-item {
            font-size: 12px; padding: 8px 10px; border-radius: 8px;
            display: flex; justify-content: space-between; align-items: center;
            cursor: pointer; transition: 0.2s; position: relative;
        }
        .track-item:hover { background: rgba(255, 255, 255, 0.1); }
        .track-item.active { background: rgba(255, 255, 255, 0.15); color: #FFF; font-weight: bold; }
        .track-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
        
        .del-btn {
            opacity: 0; width: 16px; height: 16px; margin-left: 8px;
            display: flex; align-items: center; justify-content: center;
            transition: 0.2s; font-size: 14px;
        }
        .track-item:hover .del-btn { opacity: 0.6; }
        .del-btn:hover { opacity: 1 !important; color: #ff6b6b; }

        .playing-dot {
            width: 6px; height: 6px; background: #FFF; border-radius: 50%;
            margin-right: 8px; display: none; box-shadow: 0 0 8px #FFF;
        }
        .active .playing-dot { display: inline-block; animation: breathe 2s infinite; }
        @keyframes breathe { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    </style>
</head>
<body>
    <div id="loading">
        <div class="spinner"></div>
        <h2 id="load-title">Loading...</h2>
        <br>
        <p id="load-desc">Connecting to your camera...</p>
    </div>
    
    <video id="video" playsinline></video>
    <canvas id="canvas"></canvas>

    <div id="info">
        <div>人体粒子: <span id="bodyCount">0</span></div>
        <div>掉落粒子: <span id="fallingCount">0</span></div>
        <div>海浪粒子: <span id="waveCount">0</span></div>
        <div>飞鸟: <span id="birdCount">0</span></div>
        <div>FPS: <span id="fps">0</span></div>
    </div>

    <div id="music-container">
        <div id="music-menu" class="hidden">
            <div class="upload-area" onclick="document.getElementById('file-input').click()">
                <span id="text-upload"></span>
                <input type="file" id="file-input" hidden accept="audio/*">
            </div>

            <div class="mode-switch">
                <div id="mode-list" class="mode-btn active">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"></polyline><path d="M3 11V9a4 4 0 0 1 4-4h14"></path><polyline points="7 23 3 19 7 15"></polyline><path d="M21 13v2a4 4 0 0 1-4 4H3"></path></svg>
                </div>
                <div id="mode-single" class="mode-btn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4"></path><path d="M3 11v-1a4 4 0 0 1 4-4h14"></path><path d="M7 22l-4-4 4-4"></path><path d="M21 13v1a4 4 0 0 1-4 4H3"></path><path d="M11 10h1v4"></path></svg>
                </div>
            </div>

            <div id="playlist"></div>
        </div>

        <div style="display: flex; gap: 12px;">
            <div id="menu-btn" class="glass-btn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
            </div>
            <div id="play-pause-btn" class="glass-btn">
                <svg id="icon-play" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                <svg id="icon-pause" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none;"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
            </div>
        </div>
    </div>

    <audio id="main-audio" src="BTS (방탄소년단) 'SWIM'.mp3" loop></audio>

    <script>
        // --- 国际化配置 ---
const userLang = (navigator.languages && navigator.languages.length > 0) 
                ? navigator.languages[0] 
                : (navigator.language || navigator.userLanguage);

const isChinese = userLang.toLowerCase().includes('zh');

const i18n = isChinese ? {
            loadTitle: "热热身喔！",
            loadDesc: "站起来，退后一些，然后就可以快乐游泳啦～",
            upload: "+ 添加新音乐",
            menuTip: "播放列表",
            playTip: "播放 / 暂停",
            listLoop: "列表循环",
            singleLoop: "单曲循环",
            defaultMusic: "SWIM (Default)"
        } : {
            loadTitle: "Warm up a little bit!",
            loadDesc: "Stand up, step back and enjoy the swim~",
            upload: "+ Add sth new",
            menuTip: "Playlist",
            playTip: "Play / Pause",
            listLoop: "List Loop",
            singleLoop: "Single Loop",
            defaultMusic: "SWIM (Default)"
        };

        // 注入国际化文字
        document.getElementById('load-title').innerText = i18n.loadTitle;
        document.getElementById('load-desc').innerHTML = i18n.loadDesc;
        document.getElementById('text-upload').innerHTML = i18n.upload;
        document.getElementById('menu-btn').title = i18n.menuTip;
        document.getElementById('play-pause-btn').title = i18n.playTip;
        document.getElementById('mode-list').title = i18n.listLoop;
        document.getElementById('mode-single').title = i18n.singleLoop;

        // --- 核心算法逻辑 (保持原版 100% 完整) ---
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const loading = document.getElementById('loading');

        let bodyPixNet;
        let oceanParticles = [];
        let birdFlock = [];
        let bodyParticles = [];
        let previousSegmentation = null;
        let waveOffset = 0;
        let waterPhase = 0;
        let birdAnimationState = 'flying';
        let birdWaitTimer = 0;
        let currentBirdAngle = 0;
        let isPaused = false;
        let isInitialized = false;
        let animationId;
        let lastTime = performance.now();
        let frameCount = 0;

        const config = {
            particleSpacing: 8,
            particleSize: 3,
            baseColor: '#5AB4D4',
            waveColor: '#2B7A94',
            numBirds: 7,
            birdColor: '#FFFFFF',
            birdParticleSize: 1.2,
            birdSpeed: 36,
            birdWaitTime: 20,
            birdAngles: [0, -30, -45, 30, -20, 15],
            wingFlapSpeed: 0.9,
            wingFlapAmplitude: 4,
            bodyColor: '#154175',
            bodyParticleSpacing: 6,
            bodyParticleSize: 4,
            trackingSmoothness: 0.8,
            waterWaveAmplitude: 8,
            waterWaveFrequency: 0.003,
            waterWaveSpeed: 0.05,
        };

        const waves = [
            { offset: 0, height: 180, frequency: 0.004, amplitude: 40, speed: 2.4 },
            { offset: 350, height: 120, frequency: 0.006, amplitude: 25, speed: 3.0 },
            { offset: 650, height: 200, frequency: 0.003, amplitude: 50, speed: 1.8 },
            { offset: 950, height: 140, frequency: 0.005, amplitude: 30, speed: 2.55 },
        ];

        async function setupCamera() {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: 'user', width: 1280, height: 720 },
                audio: false
            });
            video.srcObject = stream;
            return new Promise(resolve => {
                video.onloadedmetadata = () => { video.play(); resolve(video); };
            });
        }

        class OceanParticle {
            constructor(x, y) { this.x = x; this.y = y; this.size = config.particleSize; }
            getColor() {
                const screenHeight = canvas.height;
                for (let i = 0; i < waves.length; i++) {
                    const wave = waves[i];
                    const waveBaseY = (waveOffset * wave.speed + wave.offset) % (screenHeight + wave.height * 2) - wave.height;
                    const waveCurve = Math.sin(this.x * wave.frequency + waveOffset * 0.01) * wave.amplitude;
                    const waveTopY = waveBaseY + waveCurve;
                    const distanceFromTop = this.y - waveTopY;
                    if (distanceFromTop >= 0 && distanceFromTop < wave.height) {
                        let blend;
                        const topTransition = wave.height * 0.15;
                        if (distanceFromTop < topTransition) { blend = Math.pow(distanceFromTop / topTransition, 2); }
                        else { blend = Math.pow(1 - (distanceFromTop - topTransition) / (wave.height - topTransition), 2); }
                        return this.blendColors(config.baseColor, config.waveColor, blend);
                    }
                }
                return config.baseColor;
            }
            blendColors(color1, color2, ratio) {
                const hexToRgb = (hex) => {
                    const res = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
                    return res ? { r: parseInt(res[1], 16), g: parseInt(res[2], 16), b: parseInt(res[3], 16) } : null;
                };
                const c1 = hexToRgb(color1), c2 = hexToRgb(color2);
                return `rgb(${Math.round(c1.r + (c2.r-c1.r)*ratio)}, ${Math.round(c1.g + (c2.g-c1.g)*ratio)}, ${Math.round(c1.b + (c2.b-c1.b)*ratio)})`;
            }
            draw() { ctx.fillStyle = this.getColor(); ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill(); }
        }

        class BirdParticlePoint {
            constructor(offsetX, offsetY, isWing) {
                this.baseOffsetX = offsetX; this.baseOffsetY = offsetY;
                this.offsetX = offsetX; this.offsetY = offsetY; this.isWing = isWing;
            }
            updateWingPosition(flapPhase) {
                if (this.isWing) this.offsetY = this.baseOffsetY + Math.sin(flapPhase) * config.wingFlapAmplitude * 0.5;
            }
            draw(birdX, birdY) {
                ctx.fillStyle = config.birdColor; ctx.beginPath();
                ctx.arc(birdX + this.offsetX, birdY + this.offsetY, config.birdParticleSize, 0, Math.PI * 2); ctx.fill();
            }
        }

        class Bird {
            constructor(index, angle) { this.index = index; this.reset(angle); }
            createBirdShape() {
                this.angleRad = this.angle * Math.PI / 180; this.birdRotation = -Math.PI / 2 + this.angleRad;
                const pts = []; const spacing = 0.4;
                for (let y = -7; y <= 0; y += spacing) pts.push({ x: 0, y: y, part: 'body' });
                for (let i = 0; i <= 12; i++) {
                    const prog = i / 12; const x = -0.5 - i * 0.6; const y = -3 + i * 0.5 - Math.sin(prog * Math.PI) * 2;
                    pts.push({ x: x, y: y, part: 'wing' }); pts.push({ x: -x, y: y, part: 'wing' });
                }
                this.particles = pts.map(p => {
                    const cos = Math.cos(this.birdRotation), sin = Math.sin(this.birdRotation);
                    return new BirdParticlePoint((p.x*cos - p.y*sin)*this.scale, (p.x*sin + p.y*cos)*this.scale, p.part === 'wing');
                });
            }
            update() {
                this.x -= config.birdSpeed * Math.cos(this.angleRad); this.y -= config.birdSpeed * Math.sin(this.angleRad);
                this.wavePhase += 0.05; this.flapPhase += config.wingFlapSpeed;
                this.particles.forEach(p => p.updateWingPosition(this.flapPhase));
            }
            draw() { const cy = this.y + Math.sin(this.wavePhase) * 15; this.particles.forEach(p => p.draw(this.x, cy)); }
            isOffScreen() { return this.x < -100 || this.y < -100 || this.y > canvas.height + 100; }
            reset(angle) {
                this.angle = angle; this.scale = 0.7 + Math.random() * 0.6;
                this.x = canvas.width + 100 + this.index * 80; this.y = canvas.height * 0.2 + this.index * 40;
                this.wavePhase = Math.random() * Math.PI * 2; this.flapPhase = Math.random() * Math.PI * 2;
                this.createBirdShape();
            }
        }

        class BodyParticle {
            constructor(x, y, id) { this.x = x; this.y = y; this.id = id; this.targetX = x; this.targetY = y; this.baseY = y; }
            update(waterPhase) {
                this.x += (this.targetX - this.x) * config.trackingSmoothness;
                this.baseY += (this.targetY - this.baseY) * config.trackingSmoothness;
                this.y = this.baseY + Math.sin(this.x * config.waterWaveFrequency + waterPhase) * config.waterWaveAmplitude;
            }
            draw() { ctx.fillStyle = config.bodyColor; ctx.beginPath(); ctx.arc(this.x, this.y, config.bodyParticleSize, 0, Math.PI * 2); ctx.fill(); }
        }

        function setupCanvas() {
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            oceanParticles = [];
            for (let y = 0; y < canvas.height + 8; y += 8) for (let x = 0; x < canvas.width + 8; x += 8) oceanParticles.push(new OceanParticle(x, y));
            birdFlock = Array.from({length: config.numBirds}, (_, i) => new Bird(i, config.birdAngles[0]));
        }

        async function render() {
            if (isPaused) return requestAnimationFrame(render);
            const segmentation = await bodyPixNet.segmentPerson(video, { internalResolution: 'medium', segmentationThreshold: 0.7 });
            const { width, height, data } = segmentation;
            const bodyPixels = [];
            for (let y = 0; y < height; y += config.bodyParticleSpacing) {
                for (let x = 0; x < width; x += config.bodyParticleSpacing) {
                    if (data[y * width + x] === 1) bodyPixels.push({ x: canvas.width - (x / width) * canvas.width, y: (y / height) * canvas.height });
                }
            }
            bodyPixels.sort((a, b) => a.y - b.y);
            if (!isInitialized || Math.abs(bodyPixels.length - bodyParticles.length) > bodyParticles.length * 0.5) {
                bodyParticles = bodyPixels.map((p, i) => new BodyParticle(p.x, p.y, i));
                isInitialized = true;
            } else {
                for (let i = 0; i < Math.min(bodyParticles.length, bodyPixels.length); i++) {
                    bodyParticles[i].targetX = bodyPixels[i].x; bodyParticles[i].targetY = bodyPixels[i].y;
                }
            }
            waveOffset += 6; waterPhase += config.waterWaveSpeed;
            ctx.fillStyle = config.baseColor; ctx.fillRect(0, 0, canvas.width, canvas.height);
            oceanParticles.forEach(p => p.draw());
            if (birdAnimationState === 'flying') {
                let allOff = true;
                birdFlock.forEach(b => { b.update(); b.draw(); if(!b.isOffScreen()) allOff = false; });
                if(allOff) { birdAnimationState = 'waiting'; birdWaitTimer = 0; }
            } else {
                if(++birdWaitTimer >= config.birdWaitTime) {
                    const ang = config.birdAngles[Math.floor(Math.random()*config.birdAngles.length)];
                    birdFlock.forEach(b => b.reset(ang)); birdAnimationState = 'flying';
                }
            }
            bodyParticles.forEach(p => { p.update(waterPhase); p.draw(); });
            animationId = requestAnimationFrame(render);
        }

        // --- 音乐控制逻辑 ---
        const audio = document.getElementById('main-audio');
        const playlistUI = document.getElementById('playlist');
        const playPauseBtn = document.getElementById('play-pause-btn');
        const menuBtn = document.getElementById('menu-btn');
        const musicMenu = document.getElementById('music-menu');
        const fileInput = document.getElementById('file-input');

        let playlist = [{ name: i18n.defaultMusic, url: "BTS (방탄소년단) 'SWIM'.mp3", isDefault: true }];
        let currentIndex = 0, isSingleLoop = false, hasInteracted = false;

        function updatePlaylistUI() {
            playlistUI.innerHTML = '';
            playlist.forEach((t, i) => {
                const item = document.createElement('div');
                item.className = `track-item ${i === currentIndex ? 'active' : ''}`;
                item.innerHTML = `<span class="playing-dot"></span><span class="track-name">${t.name}</span>${!t.isDefault ? `<span class="del-btn" onclick="removeTrack(event, ${i})">✕</span>` : ''}`;
                item.onclick = () => playTrack(i);
                playlistUI.appendChild(item);
            });
        }

        function playTrack(i) {
            currentIndex = i; audio.src = playlist[i].url; audio.play().catch(()=>{});
            updatePlaylistUI(); togglePlayIcon(true);
        }

        function removeTrack(e, i) {
            e.stopPropagation();
            if(i === currentIndex) playTrack(0);
            else if(i < currentIndex) currentIndex--;
            playlist.splice(i, 1); updatePlaylistUI();
        }

        function togglePlayIcon(s) {
            document.getElementById('icon-play').style.display = s ? 'none' : 'block';
            document.getElementById('icon-pause').style.display = s ? 'block' : 'none';
        }

        document.body.addEventListener('click', () => { 
            if(!hasInteracted) { audio.play(); togglePlayIcon(true); hasInteracted = true; } 
        }, { once: true });
        
        playPauseBtn.onclick = () => { if(audio.paused) { audio.play(); togglePlayIcon(true); } else { audio.pause(); togglePlayIcon(false); } };
        menuBtn.onclick = () => musicMenu.classList.toggle('hidden');
        fileInput.onchange = (e) => {
            const file = e.target.files[0];
            if(file) {
                playlist.push({ name: file.name.split('.')[0], url: URL.createObjectURL(file), isDefault: false });
                playTrack(playlist.length - 1);
            }
        };
        audio.onended = () => { if(isSingleLoop) audio.play(); else playTrack((currentIndex + 1) % playlist.length); };
        document.getElementById('mode-list').onclick = () => { isSingleLoop = false; document.getElementById('mode-list').classList.add('active'); document.getElementById('mode-single').classList.remove('active'); };
        document.getElementById('mode-single').onclick = () => { isSingleLoop = true; document.getElementById('mode-single').classList.add('active'); document.getElementById('mode-list').classList.remove('active'); };

        async function init() {
            try {
                [bodyPixNet] = await Promise.all([
                    bodyPix.load({ architecture: 'MobileNetV1', outputStride: 16, multiplier: 0.75, quantBytes: 2 }),
                    setupCamera()
                ]);
                setupCanvas(); loading.style.display = 'none'; updatePlaylistUI(); render();
            } catch (e) { loading.innerHTML = `<h2 style="color:#ff6b6b">Error</h2><p>${e.message}</p>`; }
        }
        init(); window.onresize = setupCanvas;
    </script>
</body>
</html>
