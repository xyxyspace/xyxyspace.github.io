 /* Works as colour chips (2026) */
 .wc-ctl{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 22px;margin:0 0 28px}

 .wc-ctl button[aria-pressed="true"],.wc-ctl button:hover,.wc-ctl button:focus-visible{background:#ff5e00;color:#fff;outline:none}
 .wc-wall{--gap:10px;--chip:calc((100% - 4 * var(--gap)) / 5)}
 .wc-group{display:grid;grid-template-columns:150px minmax(0,1fr);gap:16px;padding:14px 0;border-top:1px solid #ece8e3}
 .wc-group:first-child{border-top:0;padding-top:0}
 .wc-group h2{margin:4px 0 0;font-size:14px;font-weight:700;line-height:1.3}
 .wc-group h2 small{display:block;font-size:12px;font-weight:400;color:#a0a0a0;margin-top:2px;line-height:1.4}
 .wc-wall.flat .wc-group{display:block;padding:0;border:0}
 .wc-wall.flat .wc-group h2{display:none}
 .wc-chips{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:var(--gap)}
 .wc-wall:not(.flat) .wc-chips{grid-template-columns:repeat(4,minmax(0,1fr))}
 .wc-chip{position:relative;aspect-ratio:1;display:block;overflow:hidden;background:var(--c);color:var(--k)!important;text-decoration:none;will-change:transform}
 .wc-chip .face{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:14px 10px 26px}
 .wc-chip .head{font-size:clamp(13px,1.35vw,18px);font-weight:700;line-height:1.2;white-space:pre-line}
 .wc-chip .meta{position:absolute;left:8px;right:8px;bottom:9px;text-align:center;font-size:11px;line-height:1.2;opacity:.82;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .wc-chip .pic{position:absolute;inset:0;background:center/cover no-repeat;opacity:0;transition:opacity .25s}
 .wc-chip .tag{position:absolute;left:0;right:0;bottom:0;padding:6px 9px;text-align:center;background:#ff5e00;color:#fff;font-size:12px;font-weight:700;opacity:0;transition:opacity .25s}
 .wc-chip:hover .pic,.wc-chip:focus-visible .pic,.wc-chip:hover .tag,.wc-chip:focus-visible .tag{opacity:1}
 .wc-chip:focus-visible{outline:3px solid #ff5e00;outline-offset:3px}
 @media (max-width:40em){
