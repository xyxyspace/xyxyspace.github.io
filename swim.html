<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>swim</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.11.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/body-pix@2.2.0"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #5AB4D4;
            overflow: hidden;
        }

        #video {
            display: none;
        }

        #canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: white;
            z-index: 100;
            background: rgba(21, 65, 117, 0.9);
            padding: 40px;
            border-radius: 10px;
        }

        .spinner {
            width: 50px;
            height: 50px;
            margin: 20px auto;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #controls {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 10;
        }

        button {
            padding: 12px 24px;
            background: rgba(21, 65, 117, 0.9);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }

        button:hover {
            background: rgba(21, 65, 117, 1);
        }

        #info {
           display: none;
        }
    </style>
</head>
<body>
    <div id="loading">
        <h2>We need a little more space to see you clearly 👀</h2>
        <div class="spinner"></div>
        <p>Take a small step back and let the light do its thing ✨</p>
    </div>
    
    <video id="video" playsinline></video>
    <canvas id="canvas"></canvas>

    <div id="info">
        <div>人体粒子: <span id="bodyCount">0</span></div>
        <div>掉落粒子: <span id="fallingCount">0</span></div>
        <div>海浪粒子: <span id="waveCount">0</span></div>
        <div>飞鸟: <span id="birdCount">0</span></div>
        <div>FPS: <span id="fps">0</span></div>
    </div>

    

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const loading = document.getElementById('loading');

        let bodyPixNet;
        let oceanParticles = [];
        let birdFlock = [];
        let bodyParticles = [];
        let previousSegmentation = null;
        let waveOffset = 0;
        let waterPhase = 0;  // 水波倒影相位
        let birdAnimationState = 'flying';
        let birdWaitTimer = 0;
        let currentBirdAngle = 0;
        let isPaused = false;
        let isInitialized = false;
        let animationId;
        let lastTime = performance.now();
        let frameCount = 0;

        const config = {
            // 海浪
            particleSpacing: 8,
            particleSize: 3,
            baseColor: '#5AB4D4',
            waveColor: '#2B7A94',
            // 飞鸟
            numBirds: 7,
            birdColor: '#FFFFFF',
            birdParticleSize: 1.2,
            birdSpeed: 36,  // 3倍速度
            birdWaitTime: 20,  // 更短等待
            birdAngles: [0, -30, -45, 30, -20, 15],
            wingFlapSpeed: 0.9,  // 3倍扇动
            wingFlapAmplitude: 4,
            // 人体
            bodyColor: '#154175',
            bodyParticleSpacing: 6,
            bodyParticleSize: 4,
            trackingSmoothness: 0.8,
            // 水波倒影效果
            waterWaveAmplitude: 8,  // 上下波动幅度
            waterWaveFrequency: 0.003,  // 波浪频率
            waterWaveSpeed: 0.05,  // 波浪速度
        };

        const waves = [
            { offset: 0, height: 180, frequency: 0.004, amplitude: 40, speed: 2.4 },  // 3倍速度
            { offset: 350, height: 120, frequency: 0.006, amplitude: 25, speed: 3.0 },
            { offset: 650, height: 200, frequency: 0.003, amplitude: 50, speed: 1.8 },
            { offset: 950, height: 140, frequency: 0.005, amplitude: 30, speed: 2.55 },
        ];

        // 设置摄像头
        async function setupCamera() {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: 'user', width: 1280, height: 720 },
                audio: false
            });
            video.srcObject = stream;
            return new Promise(resolve => {
                video.onloadedmetadata = () => {
                    video.play();
                    resolve(video);
                };
            });
        }

        // 海洋粒子类
        class OceanParticle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.size = config.particleSize;
            }

            getColor() {
                const screenHeight = canvas.height;
                for (let i = 0; i < waves.length; i++) {
                    const wave = waves[i];
                    const waveBaseY = (waveOffset * wave.speed + wave.offset) % (screenHeight + wave.height * 2) - wave.height;
                    const waveCurve = Math.sin(this.x * wave.frequency + waveOffset * 0.01) * wave.amplitude;
                    const waveTopY = waveBaseY + waveCurve;
                    const distanceFromTop = this.y - waveTopY;
                    
                    if (distanceFromTop >= 0 && distanceFromTop < wave.height) {
                        let blend;
                        const topTransition = wave.height * 0.15;
                        if (distanceFromTop < topTransition) {
                            blend = distanceFromTop / topTransition;
                            blend = blend * blend;
                        } else {
                            const fadeDistance = distanceFromTop - topTransition;
                            const fadeRange = wave.height - topTransition;
                            blend = 1 - (fadeDistance / fadeRange);
                            blend = blend * blend;
                        }
                        return this.blendColors(config.baseColor, config.waveColor, blend);
                    }
                }
                return config.baseColor;
            }

            blendColors(color1, color2, ratio) {
                const c1 = this.hexToRgb(color1);
                const c2 = this.hexToRgb(color2);
                const r = Math.round(c1.r + (c2.r - c1.r) * ratio);
                const g = Math.round(c1.g + (c2.g - c1.g) * ratio);
                const b = Math.round(c1.b + (c2.b - c1.b) * ratio);
                return `rgb(${r}, ${g}, ${b})`;
            }

            hexToRgb(hex) {
                const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
                return result ? {
                    r: parseInt(result[1], 16),
                    g: parseInt(result[2], 16),
                    b: parseInt(result[3], 16)
                } : { r: 0, g: 0, b: 0 };
            }

            draw() {
                ctx.fillStyle = this.getColor();
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // 飞鸟粒子点类
        class BirdParticlePoint {
            constructor(offsetX, offsetY, isWing, wingSide) {
                this.baseOffsetX = offsetX;
                this.baseOffsetY = offsetY;
                this.offsetX = offsetX;
                this.offsetY = offsetY;
                this.size = config.birdParticleSize;
                this.isWing = isWing;
                this.wingSide = wingSide;
            }

            updateWingPosition(flapPhase) {
                if (this.isWing) {
                    const flapOffset = Math.sin(flapPhase) * config.wingFlapAmplitude * 0.5;
                    this.offsetY = this.baseOffsetY + flapOffset;
                } else {
                    this.offsetY = this.baseOffsetY;
                }
            }

            draw(birdX, birdY) {
                ctx.fillStyle = config.birdColor;
                ctx.beginPath();
                ctx.arc(birdX + this.offsetX, birdY + this.offsetY, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // 飞鸟类
        class Bird {
            constructor(index, angle) {
                this.index = index;
                this.angle = angle;
                this.angleRad = angle * Math.PI / 180;
                this.scale = 0.7 + Math.random() * 0.6;
                this.x = canvas.width + 100 + index * 80;
                this.y = canvas.height * 0.2 + index * 40;
                this.baseY = this.y;
                this.speed = config.birdSpeed;
                this.wavePhase = Math.random() * Math.PI * 2;
                this.waveSpeed = 0.05;
                this.waveAmplitude = 15;
                this.particles = [];
                this.birdRotation = -Math.PI / 2 + this.angleRad;
                this.createBirdShape();
            }

            createBirdShape() {
                const birdType = Math.floor(Math.random() * 3);
                const particles = [];
                const spacing = 0.4;
                
                if (birdType === 0) {
                    this.createCurvedWingBird(particles, spacing);
                } else if (birdType === 1) {
                    this.createStraightWingBird(particles, spacing);
                } else {
                    this.createSweptWingBird(particles, spacing);
                }
                
                this.particles = particles.map(p => {
                    const cos = Math.cos(this.birdRotation);
                    const sin = Math.sin(this.birdRotation);
                    const rotatedX = p.x * cos - p.y * sin;
                    const rotatedY = p.x * sin + p.y * cos;
                    return new BirdParticlePoint(
                        rotatedX * this.scale,
                        rotatedY * this.scale,
                        p.part === 'wing',
                        p.part
                    );
                });
                this.flapPhase = Math.random() * Math.PI * 2;
            }
            
            createCurvedWingBird(particles, spacing) {
                for (let y = -8; y <= -7; y += spacing) {
                    particles.push({ x: 0, y: y, part: 'head' });
                }
                for (let y = -7; y <= 0; y += spacing) {
                    for (let x = -0.5; x <= 0.5; x += spacing) {
                        particles.push({ x: x, y: y, part: 'body' });
                    }
                }
                for (let i = 0; i <= 12; i += 1) {
                    const progress = i / 12;
                    const x = -0.5 - i * 0.6;
                    const y = -3 + i * 0.5 - Math.sin(progress * Math.PI) * 2;
                    const width = (1 - progress) * 1 + 0.3;
                    for (let dy = -width; dy <= width; dy += spacing) {
                        particles.push({ x: x, y: y + dy, part: 'wing' });
                    }
                }
                for (let i = 0; i <= 12; i += 1) {
                    const progress = i / 12;
                    const x = 0.5 + i * 0.6;
                    const y = -3 + i * 0.5 - Math.sin(progress * Math.PI) * 2;
                    const width = (1 - progress) * 1 + 0.3;
                    for (let dy = -width; dy <= width; dy += spacing) {
                        particles.push({ x: x, y: y + dy, part: 'wing' });
                    }
                }
            }
            
            createStraightWingBird(particles, spacing) {
                particles.push({ x: 0, y: -7, part: 'head' });
                for (let y = -7; y <= 0; y += spacing) {
                    particles.push({ x: 0, y: y, part: 'body' });
                }
                for (let i = 0; i <= 10; i += 1) {
                    const progress = i / 10;
                    const x = -0.5 - i * 0.7;
                    const y = -3 + i * 0.6;
                    const width = (1 - progress) * 0.8 + 0.2;
                    for (let dy = -width; dy <= width; dy += spacing) {
                        particles.push({ x: x, y: y + dy, part: 'wing' });
                    }
                }
                for (let i = 0; i <= 10; i += 1) {
                    const progress = i / 10;
                    const x = 0.5 + i * 0.7;
                    const y = -3 + i * 0.6;
                    const width = (1 - progress) * 0.8 + 0.2;
                    for (let dy = -width; dy <= width; dy += spacing) {
                        particles.push({ x: x, y: y + dy, part: 'wing' });
                    }
                }
            }
            
            createSweptWingBird(particles, spacing) {
                particles.push({ x: 0, y: -6, part: 'head' });
                for (let y = -6; y <= 1; y += spacing) {
                    particles.push({ x: 0, y: y, part: 'body' });
                }
                for (let i = 0; i <= 10; i += 1) {
                    const progress = i / 10;
                    const x = -0.5 - i * 0.5;
                    const y = -2 + i * 0.8;
                    const width = (1 - progress) * 0.9 + 0.3;
                    for (let dy = -width; dy <= width; dy += spacing) {
                        particles.push({ x: x, y: y + dy, part: 'wing' });
                    }
                }
                for (let i = 0; i <= 10; i += 1) {
                    const progress = i / 10;
                    const x = 0.5 + i * 0.5;
                    const y = -2 + i * 0.8;
                    const width = (1 - progress) * 0.9 + 0.3;
                    for (let dy = -width; dy <= width; dy += spacing) {
                        particles.push({ x: x, y: y + dy, part: 'wing' });
                    }
                }
            }

            update() {
                this.x -= this.speed * Math.cos(this.angleRad);
                this.y -= this.speed * Math.sin(this.angleRad);
                this.wavePhase += this.waveSpeed;
                const waveOffset = Math.sin(this.wavePhase) * this.waveAmplitude;
                this.currentY = this.y + waveOffset;
                this.flapPhase += config.wingFlapSpeed;
                for (const particle of this.particles) {
                    particle.updateWingPosition(this.flapPhase);
                }
            }

            draw() {
                for (const particle of this.particles) {
                    particle.draw(this.x, this.currentY);
                }
            }

            isOffScreen() {
                return this.x < -100 || this.y < -100 || this.y > canvas.height + 100;
            }

            reset(angle) {
                this.angle = angle;
                this.angleRad = angle * Math.PI / 180;
                this.birdRotation = -Math.PI / 2 + this.angleRad;
                this.scale = 0.7 + Math.random() * 0.6;
                this.x = canvas.width + 100 + this.index * 80;
                this.y = canvas.height * 0.2 + this.index * 40;
                this.x += (Math.random() - 0.5) * 200;
                this.y += (Math.random() - 0.5) * 150;
                this.baseY = this.y;
                this.currentY = this.y;
                this.wavePhase = Math.random() * Math.PI * 2;
                this.flapPhase = Math.random() * Math.PI * 2;
                this.particles = [];
                this.createBirdShape();
            }
        }

        // 人体粒子类
        class BodyParticle {
            constructor(x, y, id) {
                this.x = x;
                this.y = y;
                this.id = id;
                this.targetX = x;
                this.targetY = y;
                this.size = config.bodyParticleSize;
                this.baseY = y;  // 记录基础Y坐标
            }

            updateTarget(x, y) {
                this.targetX = x;
                this.targetY = y;
                this.baseY = y;  // 更新基础Y坐标
            }

            update(waterPhase) {
                const dx = this.targetX - this.x;
                const dy = this.targetY - this.baseY;  // 跟踪基础Y坐标
                this.x += dx * config.trackingSmoothness;
                this.baseY += dy * config.trackingSmoothness;
                
                // 添加水波倒影效果：上下波动
                const waveOffset = Math.sin(this.x * config.waterWaveFrequency + waterPhase) * config.waterWaveAmplitude;
                this.y = this.baseY + waveOffset;
            }

            draw() {
                ctx.fillStyle = config.bodyColor;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // 初始化海洋粒子
        function initOceanParticles() {
            oceanParticles = [];
            for (let y = 0; y < canvas.height + config.particleSpacing; y += config.particleSpacing) {
                for (let x = 0; x < canvas.width + config.particleSpacing; x += config.particleSpacing) {
                    oceanParticles.push(new OceanParticle(x, y));
                }
            }
        }

        // 初始化飞鸟
        function initBirds() {
            birdFlock = [];
            currentBirdAngle = config.birdAngles[Math.floor(Math.random() * config.birdAngles.length)];
            for (let i = 0; i < config.numBirds; i++) {
                const bird = new Bird(i, currentBirdAngle);
                bird.x += (Math.random() - 0.5) * 200;
                bird.y += (Math.random() - 0.5) * 150;
                birdFlock.push(bird);
            }
        }

        // 更新飞鸟
        function updateBirds() {
            if (birdAnimationState === 'flying') {
                let allOffScreen = true;
                for (const bird of birdFlock) {
                    bird.update();
                    if (!bird.isOffScreen()) {
                        allOffScreen = false;
                    }
                }
                if (allOffScreen) {
                    birdAnimationState = 'waiting';
                    birdWaitTimer = 0;
                }
            } else if (birdAnimationState === 'waiting') {
                birdWaitTimer++;
                if (birdWaitTimer >= config.birdWaitTime) {
                    currentBirdAngle = config.birdAngles[Math.floor(Math.random() * config.birdAngles.length)];
                    for (const bird of birdFlock) {
                        bird.reset(currentBirdAngle);
                    }
                    birdAnimationState = 'flying';
                }
            }
        }

        // 初始化人体粒子
        function initializeBodyParticles(segmentation) {
            const { width, height, data } = segmentation;
            bodyParticles = [];
            let id = 0;
            for (let y = 0; y < height; y += config.bodyParticleSpacing) {
                for (let x = 0; x < width; x += config.bodyParticleSpacing) {
                    const index = y * width + x;
                    if (data[index] === 1) {
                        const canvasX = canvas.width - (x / width) * canvas.width;
                        const canvasY = (y / height) * canvas.height;
                        bodyParticles.push(new BodyParticle(canvasX, canvasY, id++));
                    }
                }
            }
            bodyParticles.sort((a, b) => a.y - b.y);
            isInitialized = true;
        }

        // 更新人体粒子位置
        function updateBodyParticlePositions(segmentation) {
            const { width, height, data } = segmentation;
            const bodyPixels = [];
            for (let y = 0; y < height; y += config.bodyParticleSpacing) {
                for (let x = 0; x < width; x += config.bodyParticleSpacing) {
                    const index = y * width + x;
                    if (data[index] === 1) {
                        const canvasX = canvas.width - (x / width) * canvas.width;
                        const canvasY = (y / height) * canvas.height;
                        bodyPixels.push({ x: canvasX, y: canvasY });
                    }
                }
            }
            if (Math.abs(bodyPixels.length - bodyParticles.length) > bodyParticles.length * 0.5) {
                initializeBodyParticles(segmentation);
                return;
            }
            bodyPixels.sort((a, b) => a.y - b.y);
            for (let i = 0; i < Math.min(bodyParticles.length, bodyPixels.length); i++) {
                bodyParticles[i].updateTarget(bodyPixels[i].x, bodyPixels[i].y);
            }
        }

        // 设置画布
        function setupCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            initOceanParticles();
            initBirds();
        }

        window.addEventListener('resize', () => {
            setupCanvas();
            if (isInitialized && previousSegmentation) {
                initializeBodyParticles(previousSegmentation);
            }
        });

        // 主渲染循环
        async function render() {
            if (isPaused) {
                animationId = requestAnimationFrame(render);
                return;
            }

            try {
                // 人体识别
                const segmentation = await bodyPixNet.segmentPerson(video, {
                    flipHorizontal: false,
                    internalResolution: 'medium',
                    segmentationThreshold: 0.7
                });

                if (!isInitialized) {
                    initializeBodyParticles(segmentation);
                } else {
                    updateBodyParticlePositions(segmentation);
                }

                // 更新海浪（3倍速度）
                waveOffset += 6;  // 3倍速度
                
                // 更新水波倒影相位
                waterPhase += config.waterWaveSpeed;

                // 清空画布
                ctx.fillStyle = config.baseColor;
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // 绘制海洋粒子
                for (const particle of oceanParticles) {
                    particle.draw();
                }

                // 更新和绘制飞鸟
                updateBirds();
                if (birdAnimationState === 'flying') {
                    for (const bird of birdFlock) {
                        bird.draw();
                    }
                }

                // 更新和绘制人体粒子（带水波效果）
                for (const particle of bodyParticles) {
                    particle.update(waterPhase);
                    particle.draw();
                }

                // 更新调试信息
                document.getElementById('bodyCount').textContent = bodyParticles.length;
                document.getElementById('fallingCount').textContent = '0';
                document.getElementById('waveCount').textContent = oceanParticles.length;
                document.getElementById('birdCount').textContent = birdFlock.length;

            } catch (error) {
                console.error('渲染错误:', error);
            }

            // FPS
            frameCount++;
            const currentTime = performance.now();
            if (currentTime - lastTime >= 1000) {
                document.getElementById('fps').textContent = frameCount;
                frameCount = 0;
                lastTime = currentTime;
            }

            animationId = requestAnimationFrame(render);
        }

        // 重置
        function resetAll() {
            bodyParticles = [];
            previousSegmentation = null;
            isInitialized = false;
            birdAnimationState = 'waiting';
            birdWaitTimer = 0;
            initBirds();
        }

        // 初始化
        async function init() {
            try {
                [bodyPixNet] = await Promise.all([
                    bodyPix.load({
                        architecture: 'MobileNetV1',
                        outputStride: 16,
                        multiplier: 0.75,
                        quantBytes: 2
                    }),
                    setupCamera()
                ]);

                setupCanvas();
                loading.style.display = 'none';
                birdAnimationState = 'flying';
                render();

                document.getElementById('resetBtn').addEventListener('click', resetAll);
                document.getElementById('toggleBtn').addEventListener('click', () => {
                    isPaused = !isPaused;
                });

            } catch (error) {
                console.error('初始化失败:', error);
                loading.innerHTML = `
                    <h2 style="color: #ff6b6b;">初始化失败</h2>
                    <p>${error.message}</p>
                    <p>请确保允许摄像头权限</p>
                    <button onclick="location.reload()" style="margin-top: 20px; padding: 10px 20px; background: #154175; color: white; border: none; border-radius: 5px; cursor: pointer;">重新加载</button>
                `;
            }
        }

        init();

        window.addEventListener('beforeunload', () => {
            if (animationId) cancelAnimationFrame(animationId);
            if (video.srcObject) {
                video.srcObject.getTracks().forEach(track => track.stop());
            }
        });
    </script>
</body>
</html>
